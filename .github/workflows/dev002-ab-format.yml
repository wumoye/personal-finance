name: DEV-002 A-B temporary formatter
on:
  push:
    branches: [infra/dev002-ab-behavior]
    paths:
      - '.github/workflows/dev002-ab-format.yml'
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'wumoye/personal-finance' && github.event_name == 'push' && github.ref == 'refs/heads/infra/dev002-ab-behavior'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npx --no-install prettier --write tools/dev002-ab/experiment.mjs
      - name: Output safe formatted harness payload
        run: node -e "console.log('FORMAT_PAYLOAD_START'+JSON.stringify(require('fs').readFileSync('tools/dev002-ab/experiment.mjs','utf8'))+'FORMAT_PAYLOAD_END')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev002-ab-format-${{ github.sha }}
          path: tools/dev002-ab/experiment.mjs
          retention-days: 1
