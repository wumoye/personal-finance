name: DEV-002 B-0 ephemeral formatting preview

on:
  push:
    branches: [infra/dev002-phase-b0]
    paths:
      - .github/workflows/auth-b0-format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'wumoye/personal-finance' && github.ref == 'refs/heads/infra/dev002-phase-b0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Format only B-0 scripts in isolated runner
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npx --no-install prettier --write tools/auth-e2e-b0/*.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b0-format-preview-${{ github.sha }}
          path: tools/auth-e2e-b0/*.mjs
          retention-days: 1
