name: DEV-002 temporary no-secret formatter
on:
  push:
    branches: [infra/dev002-ab-behavior]
    paths: ['.github/workflows/dev002-ab-formatter.yml']
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'wumoye/personal-finance' && github.ref == 'refs/heads/infra/dev002-ab-behavior'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npx --no-install prettier --write tools/dev002-ab/*.mjs
      - name: Output formatted no-secret scripts as JSON
        run: |
          node -e "let fs=require('fs');for(let p of ['tools/dev002-ab/supplement.mjs','tools/dev002-ab/evidence-gate.mjs'])console.log('FORMATTED_JSON_'+p+'='+JSON.stringify(fs.readFileSync(p,'utf8')))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev002-formatted-${{ github.sha }}
          path: tools/dev002-ab/*.mjs
          retention-days: 1
